name: BTC Predictor

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-predictor
  cancel-in-progress: false

jobs:
  predict:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Download historical BTC data
        run: |
          python src/backfill.py
          
      - name: Collect BTC data
        run: |
          python src/market_data.py

      - name: Save BTC dataset
        run: |
          git config user.name "BTC Predictor Bot"
          git config user.email "btc-predictor-bot@users.noreply.github.com"

          git add data/btc_1h.csv

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Update BTC 1H dataset"
            git push
          fi
